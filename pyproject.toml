[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flycast"
version = "0.1.0"
description = "Connectome mouth: larva wiring → text in, English out. Core library + product profiles under examples/."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Mark Hopkins" },
    { name = "Otto Vernal", email = "otto.vernal@decisionsciencecorp.com" },
]
keywords = ["connectome", "drosophila", "fly", "mouth", "AGPL"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "playwright>=1.40",
]
train = [
    "torch>=2.0",
]
jevlab = [
    "scikit-learn>=1.6",
]

[project.scripts]
flycast = "flycast.cli:main"

[project.urls]
Repository = "https://github.com/actuallyrizzn/fly-cast"
Documentation = "https://github.com/actuallyrizzn/fly-cast/tree/master/docs"
"License (code)" = "https://github.com/actuallyrizzn/fly-cast/blob/master/licenses/AGPL-3.0.txt"
"License (docs)" = "https://github.com/actuallyrizzn/fly-cast/blob/master/licenses/CC-BY-SA-4.0.txt"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flycast = ["data/*.csv.gz", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=flycast",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["flycast"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
